name: Deploy PowerResolve to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: powerresolve-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.CF_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run all backend workflow tests
        run: npm test
      - name: Resolve D1, migrate production database and deploy Worker
        run: npm run deploy
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POWERRESOLVE_D1_DATABASE_ID: ${{ vars.POWERRESOLVE_D1_DATABASE_ID }}
      - name: Verify public health endpoint
        if: ${{ vars.POWERRESOLVE_SERVICE_URL != '' }}
        env:
          SERVICE_URL: ${{ vars.POWERRESOLVE_SERVICE_URL }}
        run: |
          test -n "$SERVICE_URL"
          curl --fail --show-error --location --retry 4 --retry-delay 2 --max-time 20 "$SERVICE_URL/api/health"
