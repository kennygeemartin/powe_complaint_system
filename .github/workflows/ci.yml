name: Validate Cloudflare application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  statuses: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute workflow and access-control tests
        id: unit_tests
        run: npm test
      - name: Publish CI verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.unit_tests.outcome }}
        run: |
          if [ "$RESULT" = "success" ]; then
            STATE=success
            DESCRIPTION="PowerResolve automated suite passed"
          else
            STATE=failure
            DESCRIPTION="PowerResolve automated suite failed"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" -f context=PowerResolve-CI \
            -f description="$DESCRIPTION" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
