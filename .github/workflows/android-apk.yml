name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable test APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify build output and SHA-256
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/PowerResolve-Android-debug.apk.sha256
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/PowerResolve-Android-debug.apk
      - name: Upload downloadable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PowerResolve-Android-APK
          path: |
            android/app/build/outputs/apk/debug/PowerResolve-Android-debug.apk
            android/app/build/outputs/apk/debug/PowerResolve-Android-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
