name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable test APK
        env:
          POWERRESOLVE_SERVICE_URL: ${{ vars.POWERRESOLVE_SERVICE_URL }}
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify build output and SHA-256
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/PowerResolve-Android-debug.apk.sha256
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/PowerResolve-Android-debug.apk
      - name: Upload downloadable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PowerResolve-Android-APK
          path: |
            android/app/build/outputs/apk/debug/PowerResolve-Android-debug.apk
            android/app/build/outputs/apk/debug/PowerResolve-Android-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30