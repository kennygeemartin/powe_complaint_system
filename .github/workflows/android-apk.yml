name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check configured PowerResolve service
        env:
          POWERRESOLVE_SERVICE_URL: ${{ vars.POWERRESOLVE_SERVICE_URL || 'https://powe-complaint-system.kennygeemartin.workers.dev' }}
        run: |
          case "$POWERRESOLVE_SERVICE_URL" in
            https://*) ;;
            *) echo "::error::POWERRESOLVE_SERVICE_URL must begin with https://"; exit 1 ;;
          esac
          curl --fail --silent --show-error --retry 4 --retry-delay 3 --max-time 25 "$POWERRESOLVE_SERVICE_URL/api/health" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{let x;try{x=JSON.parse(s)}catch{process.exit(1)}if(x.status!=="ok")process.exit(1);console.log("Verified live PowerResolve service:",x.service)})'
      - name: Build installable test APK
        env:
          POWERRESOLVE_SERVICE_URL: ${{ vars.POWERRESOLVE_SERVICE_URL || 'https://powe-complaint-system.kennygeemartin.workers.dev' }}
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify build output and SHA-256
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/PowerResolve-Android-debug.apk.sha256
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/PowerResolve-Android-debug.apk
      - name: Upload downloadable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PowerResolve-Android-APK
          path: |
            android/app/build/outputs/apk/debug/PowerResolve-Android-debug.apk
            android/app/build/outputs/apk/debug/PowerResolve-Android-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish installable APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v1.0.3-connected"
          DIR="android/app/build/outputs/apk/debug"
          ASSET="PowerResolve-Android-v1.0.3-connected.apk"
          cp "$DIR/PowerResolve-Android-debug.apk" "$DIR/$ASSET"
          sha256sum "$DIR/$ASSET" > "$DIR/$ASSET.sha256"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "PowerResolve Android v1.0.3 (test APK)" \
              --notes "Android client connected to PowerResolve Cloudflare Worker. Debug-signed for test devices; not a Play Store release." \
              --prerelease
          fi
          gh release upload "$TAG" "$DIR/$ASSET" "$DIR/$ASSET.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          echo "APK URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET"
      - name: Add GitHub status pointing to the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/android-v1.0.3-connected/PowerResolve-Android-v1.0.3-connected.apk"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context=PowerResolve-Android-APK \
            -f description="Installable Android test APK available" -f target_url="$URL"
