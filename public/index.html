<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#132652"/><title>PowerResolve • Service complaints</title>
<style>
:root{--navy:#14284f;--navy2:#203963;--ink:#18243a;--muted:#65728b;--light:#f5f7fb;--border:#e4e9f2;--blue:#305ff4;--teal:#11a88b;--danger:#e94a60;--amber:#db961b;--r:18px;--shadow:0 8px 30px rgba(20,40,79,.09)}*{box-sizing:border-box}body{margin:0;font:14px/1.48 'Segoe UI',Arial,sans-serif;background:var(--light);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}h1,h2,h3,p{margin-top:0}h1{font-size:26px;letter-spacing:-.8px}h2{font-size:20px;letter-spacing:-.4px;margin-bottom:14px}h3{font-size:16px;margin-bottom:8px}.app{min-height:100vh;display:flex}.sidebar{width:252px;background:var(--navy);color:white;min-height:100vh;padding:25px 17px;position:sticky;top:0;align-self:flex-start}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;margin:4px 9px 39px;letter-spacing:-.5px}.brand-mark{display:grid;place-items:center;width:37px;height:37px;border-radius:11px;background:linear-gradient(135deg,#44d8b7,#3472fa);color:#fff;font-size:20px}.brand small{font-size:9px;font-weight:500;letter-spacing:1.5px;display:block;opacity:.75}.side-label{font-size:10px;color:#91a7c9;letter-spacing:2px;margin:0 13px 12px;text-transform:uppercase}.nav{display:block;border:0;background:transparent;color:#b9c9e5;padding:13px 15px;border-radius:12px;width:100%;text-align:left;margin:4px 0;font-weight:600}.nav:hover,.nav.active{color:white;background:#2c4776}.nav i{font-style:normal;margin-right:12px}.side-footer{margin-top:36px;border-top:1px solid #34466c;padding:24px 10px;color:#b9c9e5;font-size:12px}.side-footer strong{display:block;color:#fff;font-size:14px}.main{flex:1;max-width:1550px;margin:0 auto;padding:27px 34px 65px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:33px}.crumb{color:#8792a7;font-size:12px}.identity{display:flex;align-items:center;gap:11px;font-weight:700}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#dce5fc;color:#2443a8;font-weight:800}.eyebrow{color:#2c67b2;text-transform:uppercase;letter-spacing:2px;font-weight:800;font-size:10px}.hero{background:linear-gradient(117deg,#142a56 8%,#2a4d88 69%,#3384aa);border-radius:22px;padding:30px 32px;color:white;box-shadow:var(--shadow);position:relative;overflow:hidden;margin:12px 0 25px}.hero:before{content:'⚡';position:absolute;right:41px;top:-45px;color:#ffffff13;font-size:190px;transform:rotate(10deg)}.hero h1{font-size:28px;line-height:1.2;margin:8px 0}.hero p{max-width:480px;color:#d5e3fb}.hero .action{background:white;color:#1e407b}.action{background:var(--blue);color:white;border:0;border-radius:11px;padding:11px 17px;font-weight:700;box-shadow:0 4px 12px #2858db23}.action:hover{filter:brightness(.97)}.action.secondary{background:#edf2fb;color:#274c87;box-shadow:none}.action.outline{background:white;border:1px solid #d8dfec;color:#264678;box-shadow:none}.action.danger{background:#fff0f1;color:#af203d;box-shadow:none}.action:disabled{opacity:.5;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:16px;margin:22px 0}.stat{padding:21px 20px;border-radius:var(--r);background:#fff;box-shadow:var(--shadow);border:1px solid #eef2f6}.stat label{display:block;color:var(--muted);font-size:12px;margin-bottom:11px}.stat strong{display:block;font-size:29px;letter-spacing:-1px}.stat em{font-style:normal;font-size:12px;color:#16a381}.two-col{display:grid;grid-template-columns:1.45fr 1fr;gap:20px}.panel{background:#fff;border-radius:18px;padding:22px;box-shadow:var(--shadow);border:1px solid #edf1f6;margin-bottom:18px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:13px}.panel-head h2{margin:0}.sub{color:var(--muted);font-size:12px}.list-card{padding:15px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}.list-card:last-child{border:0}.case-title{font-weight:750}.case-id{font-size:11px;color:#6a78a0;font-weight:700}.case-meta{color:var(--muted);font-size:12px;margin-top:5px}.pill{display:inline-block;border-radius:30px;padding:4px 9px;background:#eaf2ff;color:#2758b9;font-size:10px;font-weight:800;white-space:nowrap;text-transform:capitalize}.pill.emergency{background:#fff0f0;color:#c6414b}.pill.high{background:#fff2da;color:#a86e0b}.pill.routine{background:#eaf8f3;color:#108a77}.pill.resolved,.pill.closed{background:#e9f9ef;color:#128453}.pill.in_progress{background:#eff0ff;color:#5755bd}.smallnote{font-size:11px;color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}.field label{font-weight:700;color:#44516a;font-size:12px}.field input,.field select,.field textarea{background:#fafbfd;padding:12px 13px;border:1px solid #dce3ef;border-radius:10px;outline:none;color:var(--ink);width:100%}.field input:focus,.field select:focus,.field textarea:focus{border-color:#4d78ee;background:white;box-shadow:0 0 0 3px #5177ef20}.field textarea{resize:vertical;min-height:100px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.headerline{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:14px 0 18px}.filter{border:1px solid #dce3ee;padding:10px;border-radius:10px;background:white}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;background:#f7f9fc;color:#6a7890;font-size:11px;letter-spacing:.3px;padding:13px 12px}td{padding:14px 12px;border-bottom:1px solid #edf0f6;font-size:12px}tr:hover td{background:#fbfcff}.textbtn{border:0;background:transparent;color:#315fcf;font-weight:750;padding:4px 0}.timeline{position:relative;padding:4px 0 0 16px;border-left:2px solid #d5e3f6;margin-left:8px}.event{position:relative;margin:0 0 22px 12px}.event:before{content:'';position:absolute;left:-24px;top:4px;width:10px;height:10px;background:#3e72db;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #cbdaf4}.event strong{display:block;text-transform:capitalize}.event time{color:#72819b;font-size:11px}.event p{font-size:12px;color:#65728b;margin:3px 0}.successbar{background:#eaf8f0;color:#0e7755;border-radius:12px;padding:12px;margin:12px 0}.errorbar{background:#fff0f2;color:#ad2946;border-radius:12px;padding:12px;margin:12px 0}.tip{padding:13px 16px;background:#eef5ff;border-left:3px solid #5383ec;border-radius:10px;color:#486385;font-size:12px}.auth{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 10% 80%,#dceaff,transparent 25%),linear-gradient(120deg,#eaf0fb,#f8fafc)}.authbox{max-width:440px;width:100%;background:white;border-radius:23px;padding:38px;box-shadow:0 23px 70px #14284f1d}.logoauth{display:flex;align-items:center;gap:10px;margin-bottom:35px;font-size:22px;font-weight:800;color:var(--navy)}.authbox h1{margin-bottom:7px}.authbox p{color:var(--muted)}.foot{font-size:10px;color:#8b96aa;text-align:center;margin-top:25px}.kpi-bar{height:7px;background:#edf2f7;border-radius:9px;overflow:hidden;margin:12px 0}.kpi-fill{height:100%;background:#21aa9b;border-radius:9px}.mobileheader{display:none}.toast{position:fixed;right:25px;bottom:25px;background:#152b52;color:white;border-radius:12px;padding:13px 18px;z-index:99;box-shadow:var(--shadow)}
@media(max-width:870px){.sidebar{width:76px;padding:20px 8px}.brand{font-size:0;margin:0 10px 32px}.brand small,.side-label,.side-footer,.nav span{display:none}.nav{text-align:center;padding:14px 2px;font-size:19px}.nav i{margin:0}.main{padding:20px 20px}.two-col{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.app{display:block}.sidebar{position:fixed;bottom:0;top:auto;left:0;width:100%;height:69px;min-height:auto;z-index:20;display:flex;justify-content:space-around;align-items:center;padding:8px;background:#14284f}.sidebar .brand,.side-label,.side-footer{display:none}.nav{width:24%;margin:0;font-size:20px;padding:6px}.nav span{display:block;font-size:8px;letter-spacing:.1px}.nav i{display:block}.main{padding:15px 14px 100px}.top{margin-bottom:16px}.crumb{display:none}.hero{padding:25px 22px}.hero h1{font-size:24px}.hero:before{right:0;font-size:135px}.stats{gap:11px}.stat{padding:15px}.stat strong{font-size:24px}.grid2{grid-template-columns:1fr;gap:0}.panel{padding:18px}.authbox{padding:28px}.headerline{flex-wrap:wrap}h1{font-size:24px}}

/* Android-first improvements: larger controls, better bottom navigation, safe-area support. */
:focus-visible{outline:3px solid #30a8eb;outline-offset:3px}
input,textarea,select{font-size:16px;min-height:46px}
input[type=checkbox]{min-height:auto;transform:scale(1.18);margin-right:7px}
button,.action,.nav{touch-action:manipulation}
.action{min-height:48px}
@media(max-width:720px){
 .app{display:block}
 .sidebar{position:fixed;bottom:0;top:auto;left:0;right:0;width:100%;
   min-height:0;height:calc(75px + env(safe-area-inset-bottom));z-index:30;
   display:flex;justify-content:space-around;align-items:flex-start;
   padding:5px 8px calc(4px + env(safe-area-inset-bottom));background:#14284f;
   box-shadow:0 -5px 21px #08182b29}
 .sidebar .brand,.sidebar .side-label,.sidebar .side-footer{display:none}
 .sidebar .nav{width:25%;height:64px;min-height:60px;margin:0;padding:6px 2px;
   font-size:14px;text-align:center;border-radius:12px;display:flex;flex-direction:column;
   justify-content:center;align-items:center;gap:1px;color:#d1dff7}
 .sidebar .nav.active{background:#2a4b82;color:#fff}
 .sidebar .nav i{display:block;font-size:24px;line-height:27px;margin:0}
 .sidebar .nav span{display:block;font-size:11px;line-height:14px;letter-spacing:0;font-weight:700}
 .main{width:100%;padding:16px 14px calc(100px + env(safe-area-inset-bottom));overflow-x:hidden}
 .top{margin-bottom:16px;gap:10px;flex-wrap:wrap}
 .crumb{display:none}
 .headerline{gap:12px;flex-wrap:wrap}
 .two-col,.grid2{grid-template-columns:1fr}

}

</style></head><body><div id="root"></div><script>
const root=document.getElementById('root'), CATS=['Outage','Meter fault','Billing','Safety hazard','Voltage fluctuation','Transformer fault'];
let saved=JSON.parse(localStorage.getItem('pwrSession')||'null'), current='dashboard', selected=null, loading=false, message='', filter='all', cache=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function alertMsg(s,bad=false){message=(bad?'ERROR: ':'')+s;let t=document.getElementById('notice');if(t){t.innerHTML=`<div class="${bad?'errorbar':'successbar'}">${esc(message)}</div>`;setTimeout(()=>{if(t)t.innerHTML=''},6000)}else alert(s)}
async function api(path,method='GET',data){let opts={method,headers:{}};if(saved?.token)opts.headers.Authorization='Bearer '+saved.token;if(data!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(data)}let res=await fetch('/api'+path,opts);let obj=await res.json().catch(()=>({}));if(!res.ok)throw Error(obj.detail||'Request failed ('+res.status+')');return obj}
function logout(){if(saved?.token)fetch('/api/logout',{method:'POST',headers:{Authorization:'Bearer '+saved.token}}).catch(()=>{});saved=null;localStorage.removeItem('pwrSession');current='dashboard';render()}
async function authenticate(e,register){e.preventDefault();let alias=document.getElementById('alias').value,password=document.getElementById('password').value;try{if(register)await api('/register','POST',{alias,password});saved=await api('/login','POST',{alias,password});localStorage.setItem('pwrSession',JSON.stringify(saved));render()}catch(e){alertMsg(e.message,true)}}
function authPage(register=false){root.innerHTML=`<div class="auth"><div class="authbox"><div class="logoauth"><div class="brand-mark">⚡</div> PowerResolve</div><div class="eyebrow">ELECTRICITY SERVICE HELP DESK</div><h1>${register?'Create an account':'Welcome back'}</h1><p>${register?'Register as a consumer to report and track electricity service problems.':'Sign in to access your complaint workspace and updates.'}</p><div id="notice"></div><form id="authform"><div class="field"><label>Account alias</label><input id="alias" placeholder="e.g. Consumer01" required minlength="3"/></div><div class="field"><label>Password</label><input id="password" placeholder="Enter password" type="password" required minlength="8"/></div><button class="action" style="width:100%;margin-top:8px" type="submit">${register?'Create account':'Sign in securely'}</button></form><p style="text-align:center;margin:20px 0 0"><a href="#" id="toggle">${register?'Already registered? Sign in':'New user? Create an account'}</a></p><div class="tip" style="margin-top:22px">Local research prototype. Demo identities are synthetic. Contact the electricity provider directly for actual hazards.</div><div class="foot">POWERRESOLVE • RESEARCH SOFTWARE DEMONSTRATION</div></div></div>`;document.getElementById('authform').onsubmit=e=>authenticate(e,register);document.getElementById('toggle').onclick=e=>{e.preventDefault();authPage(!register)}}
function navTo(x){current=x;selected=null;render()}
function scaffold(){let user=saved.user, who=user.role, nav=[['dashboard','▦','Overview'],['complaints','▤','Complaints'],...(who==='consumer'?[['new','⊕','Report issue']]:[]),['about','ⓘ','About']];return `<div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">⚡</span><div>PowerResolve<small>SMART SERVICE DESK</small></div></div><div class="side-label">Workspace</div>${nav.map(n=>`<button class="nav ${current===n[0]?'active':''}" onclick="navTo('${n[0]}')"><i>${n[1]}</i> <span>${n[2]}</span></button>`).join('')}<div class="side-footer"><strong>${esc(user.alias)}</strong>${esc(who.toUpperCase())}<p style="margin-top:16px"><button class="nav" onclick="logout()">↩ <span>Sign out</span></button></p></div></aside><main class="main"><header class="top"><div><div class="eyebrow">POWERRESOLVE / ${who.toUpperCase()}</div><div class="crumb">Service intelligence / ${esc(current)}</div></div><div class="identity"><span>${esc(user.alias)}</span><div class="avatar">${esc(user.alias.slice(0,2).toUpperCase())}</div><button class="textbtn" onclick="logout()">Exit</button></div></header><div id="notice"></div><section id="view"></section><div class="foot" style="text-align:left">Functional local prototype · Simulated records · Not connected to a distribution company</div></main></div>`}
function statusPill(s){return `<span class="pill ${esc(s)}">${esc(s.replaceAll('_',' '))}</span>`}
function priPill(s){return `<span class="pill ${String(s).toLowerCase()}">${esc(s)}</span>`}
function fmtDate(s){return s?new Date(s).toLocaleString('en-NG',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}
async function render(){if(!saved){authPage();return}root.innerHTML=scaffold();let view=document.getElementById('view');view.innerHTML='<div class="panel">Loading workspace…</div>';try{if(current==='dashboard'){let [stats,list]=await Promise.all([api('/stats'),api('/complaints')]);cache=list;view.innerHTML=dashboard(stats,list)}else if(current==='complaints'){cache=await api('/complaints');view.innerHTML=selected?await detail(selected):complaintsPage(cache)}else if(current==='new'){view.innerHTML=newPage();initNew()}else view.innerHTML=aboutPage()}catch(e){view.innerHTML=`<div class="errorbar">${esc(e.message)}</div>`}}
function dashboard(stats,list){let user=saved.user,done=stats.resolved,rate=stats.total?Math.round(done/stats.total*100):0;return `<div class="eyebrow">LIVE WORKSPACE / DEMONSTRATION</div><div class="hero"><div class="eyebrow" style="color:#86e3db">YOUR DIGITAL UTILITY DESK</div><h1>${user.role==='consumer'?'Electricity support, simplified.':'Manage cases with clarity.'}</h1><p>${user.role==='consumer'?'Report an outage, meter problem, billing concern or electrical hazard — and follow every status update.':'Monitor incoming electricity service complaints, prioritize hazards and maintain an accountable resolution history.'}</p><button class="action" onclick="navTo('${user.role==='consumer'?'new':'complaints'}')">${user.role==='consumer'?'+ Report a complaint':'Open complaint queue'}</button></div><div class="stats"><div class="stat"><label>Total complaints</label><strong>${stats.total}</strong><em>Registered cases</em></div><div class="stat"><label>Closed / resolved</label><strong>${done}</strong><em>Recorded state</em></div><div class="stat"><label>Emergency reports</label><strong>${stats.emergency}</strong><em>Priority triage</em></div><div class="stat"><label>Case completion</label><strong>${rate}%</strong><em>Demo workflow</em></div></div><div class="two-col"><div class="panel"><div class="panel-head"><h2>Recent complaints</h2><button class="textbtn" onclick="navTo('complaints')">View all →</button></div>${list.slice(0,6).map(c=>`<div class="list-card"><div><div class="case-title">${esc(c.category)}</div><div class="case-id">${esc(c.reference)}</div><div class="case-meta">${esc(c.address)} · ${fmtDate(c.created_at)}</div></div><div style="text-align:right">${statusPill(c.status)}<br/><button class="textbtn" onclick="openCase(${c.id})">Details</button></div></div>`).join('')||'<p class="sub">No complaints yet. Create a report to begin.</p>'}</div><div><div class="panel"><h2>Workflow visibility</h2><p class="sub">Records are tracked from intake through administrative review, assignment, field work and resolution.</p><div class="kpi-bar"><div class="kpi-fill" style="width:${rate}%"></div></div><strong>${done} of ${stats.total}</strong> cases resolved or closed <div class="tip" style="margin-top:22px">⚡ Safety hazards receive Emergency priority in the system. This software is not an emergency response channel.</div></div><div class="panel"><h3>Common categories</h3>${['Outage','Meter fault','Billing','Safety hazard'].map(s=>`<p class="sub" style="margin:9px 0">${s}: <strong>${list.filter(a=>a.category===s).length}</strong></p>`).join('')}</div></div></div>`}
function complaintsPage(list){let options=['all','received','reviewed','assigned','in_progress','resolved','reopened','closed'];let filtered=filter==='all'?list:list.filter(c=>c.status===filter);return `<div class="headerline"><div><div class="eyebrow">COMPLAINT WORKFLOW</div><h1>${saved.user.role==='consumer'?'My complaints':'Complaint management'}</h1><p class="sub">Every case has an identifiable reference, priority and traceable status history.</p></div>${saved.user.role==='consumer'?'<button class="action" onclick="navTo(\'new\')">+ New report</button>':''}</div><div class="panel"><div class="panel-head"><h2>Registered cases <span class="sub">(${filtered.length})</span></h2><select class="filter" id="filter" onchange="changeFilter(this.value)">${options.map(s=>`<option value="${s}" ${filter===s?'selected':''}>${s==='all'?'All statuses':s.replace('_',' ')}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>REFERENCE</th><th>ISSUE / LOCATION</th><th>PRIORITY</th><th>STATUS</th><th>${saved.user.role==='consumer'?'SUBMITTED':'CONSUMER / ASSIGNED'}</th><th>ACTION</th></tr></thead><tbody>${filtered.map(c=>`<tr><td><b>${esc(c.reference)}</b></td><td><b>${esc(c.category)}</b><div class="smallnote">${esc(c.address.slice(0,34))}</div></td><td>${priPill(c.priority)}</td><td>${statusPill(c.status)}</td><td>${saved.user.role==='consumer'?fmtDate(c.created_at):esc(c.consumer)+' / '+esc(c.agent||'Unassigned')}</td><td><button class="textbtn" onclick="openCase(${c.id})">View →</button></td></tr>`).join('')}</tbody></table>${!filtered.length?'<p class="sub">There are no cases in the selected view.</p>':''}</div></div>`}
function changeFilter(s){filter=s;document.getElementById('view').innerHTML=complaintsPage(cache)}
function openCase(id){selected=id;current='complaints';render()}
async function detail(id){let c=await api('/complaints/'+id),u=saved.user,events=c.events;let agents=[];if(u.role==='admin')agents=await api('/agents');return `<div class="headerline"><div><button class="textbtn" onclick="navTo('complaints')">← All cases</button><div class="eyebrow">CASE DETAIL / ${esc(c.reference)}</div><h1>${esc(c.category)}</h1><p class="sub">Recorded ${fmtDate(c.created_at)} · ${esc(c.address)}</p></div><div>${priPill(c.priority)} ${statusPill(c.status)}</div></div><div class="two-col"><div><div class="panel"><h2>Complaint information</h2><p>${esc(c.details)}</p><div class="grid2"><div><h3>Service address</h3><p class="sub">${esc(c.address)}</p></div><div><h3>GPS coordinates</h3><p class="sub">${c.lat===null?'Not supplied':Number(c.lat).toFixed(5)+', '+Number(c.lon).toFixed(5)}</p></div><div><h3>Priority</h3><p>${priPill(c.priority)}</p></div><div><h3>Assigned agent</h3><p class="sub">${c.assigned_to||'Unassigned'}</p></div></div><div class="tip">Complaint reference: <b>${esc(c.reference)}</b>. Notifications appear in this recorded event timeline.</div></div><div class="panel"><h2>Case activity</h2><div class="timeline">${events.slice().reverse().map(e=>`<div class="event"><strong>${esc(e.to_status.replace('_',' '))}</strong><time>${fmtDate(e.occurred_at)} · ${esc(e.actor)}</time><p>${esc(e.note||'Status update recorded')}</p></div>`).join('')}</div></div></div><div><div class="panel"><h2>Available actions</h2>${actions(c,agents)}<hr style="border:0;border-top:1px solid #e7edf6;margin:20px 0"><h3>Feedback and evidence</h3><p class="sub">Feedback cycles: ${c.feedback.length}; stored images: ${c.evidence.length}</p>${c.feedback.map(f=>`<p class="smallnote">Rating ${f.rating}/5 — ${esc(f.comment)}</p>`).join('')}</div><div class="panel"><h3>Operational timestamps</h3>${[['Received',c.created_at],['Assigned',c.assigned_at],['Started',c.started_at],['Resolved',c.resolved_at]].map(x=>`<p class="sub">${x[0]}: <b>${fmtDate(x[1])}</b></p>`).join('')}</div></div></div>`}
function actions(c,agents){let status=c.status,role=saved.user.role,act='';if(role==='admin'){if(status==='received')act=`<button class="action" onclick="doAction(${c.id},'review')">Mark reviewed</button>`;if(status==='reviewed')act=`<div class="field"><label>Assign technician</label><select id="agentPick">${agents.map(a=>`<option value="${a.id}">${esc(a.alias)}</option>`).join('')}</select></div><button class="action" onclick="doAction(${c.id},'assign')">Assign case</button>`;if(status==='resolved')act=`<button class="action" onclick="doAction(${c.id},'close')">Close confirmed case</button>`}else if(role==='agent'){if(status==='assigned'||status==='reopened')act=`<button class="action" onclick="doAction(${c.id},'${status==='assigned'?'start':'resume'}')">Start work</button>`;if(status==='in_progress')act=`<div class="field"><label>Work performed</label><textarea id="actionNote" placeholder="Document action and outcome"></textarea></div><button class="action" onclick="doAction(${c.id},'resolve')">Record resolution</button>`}else if(role==='consumer'&&status==='resolved'){act=`<div class="field"><label>Was this case handled satisfactorily?</label><select id="rating"><option value="5">5 – Excellent</option><option value="4">4 – Good</option><option value="3">3 – Fair</option><option value="2">2 – Poor</option><option value="1">1 – Very poor</option></select></div><div class="field"><label>Feedback</label><textarea id="feedback" placeholder="Share your experience"></textarea></div><button class="action" onclick="sendFeedback(${c.id})">Save feedback</button><hr style="border:0;border-top:1px solid #eee;margin:18px 0"><div class="field"><label>Still unresolved? Explain why</label><textarea id="actionNote" placeholder="Issue persists despite reported action"></textarea></div><button class="action danger" onclick="doAction(${c.id},'reopen')">Reopen case</button>`}return act||'<p class="sub">No actions available for this role and case state.</p>'}
async function doAction(id,action){let agent_id=document.getElementById('agentPick')?Number(document.getElementById('agentPick').value):undefined,note=document.getElementById('actionNote')?.value||'';try{await api('/complaints/'+id+'/action','POST',{action,agent_id,note});render()}catch(e){alertMsg(e.message,true)}}
async function sendFeedback(id){try{await api('/complaints/'+id+'/feedback','POST',{rating:Number(document.getElementById('rating').value),comment:document.getElementById('feedback').value});render()}catch(e){alertMsg(e.message,true)}}
function newPage(){return `<div class="eyebrow">CONSUMER SELF SERVICE</div><h1>Report electricity problem</h1><p class="sub">A few details help the right team identify and process your report.</p><div class="two-col"><div class="panel"><h2>New complaint</h2><form id="complaintForm"><div class="field"><label>Type of problem *</label><select required id="category">${CATS.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Describe what happened *</label><textarea id="details" required minlength="10" placeholder="For example: Electricity went off for this street at about 2 pm"></textarea></div><div class="field"><label>Address or landmark *</label><input required id="address" minlength="6" placeholder="Street, district and nearby landmark"/></div><div class="grid2"><div class="field"><label>Latitude (optional)</label><input id="lat" type="number" step="any" min="-90" max="90" placeholder="6.4491"/></div><div class="field"><label>Longitude (optional)</label><input id="lon" type="number" step="any" min="-180" max="180" placeholder="7.5028"/></div></div><button class="action secondary" type="button" onclick="getGPS()">⌖ Use device location</button><div class="grid2"><div class="field"><label>Estimated consumers affected</label><input id="affected" type="number" min="1" max="100000" value="1"/></div><div class="field"><label style="margin-top:23px"><input type="checkbox" id="hazard" style="width:auto"> Immediate electrical hazard</label></div></div><div class="field"><label>Evidence image (optional, PNG/JPEG/WEBP, maximum 2 MB)</label><input id="evidenceFile" type="file" accept="image/png,image/jpeg,image/webp"/></div><button class="action" style="width:100%;margin-top:16px" type="submit">Submit complaint securely →</button></form><div id="submitResult"></div></div><div><div class="panel"><h2>What happens next?</h2><div class="timeline"><div class="event"><strong>Submit your report</strong><p>Receive a unique complaint reference.</p></div><div class="event"><strong>Administrative review</strong><p>Urgency and service area are reviewed.</p></div><div class="event"><strong>Assignment and action</strong><p>Authorized agents record each step.</p></div><div class="event"><strong>Follow the outcome</strong><p>View status and submit feedback.</p></div></div></div><div class="tip">For exposed conductors, fires or immediate danger: keep a safe distance and contact official emergency services. Reporting here does not dispatch an actual team.</div></div></div>`}
function initNew(){let f=document.getElementById('complaintForm');f.onsubmit=async e=>{e.preventDefault();let obj={request_id:(crypto.randomUUID?.()||'pwr-'+Date.now()+'-'+Math.random()),category:category.value,details:details.value,address:address.value,lat:lat.value?Number(lat.value):null,lon:lon.value?Number(lon.value):null,hazard:hazard.checked,affected:Number(affected.value)};try{let chosen=document.getElementById('evidenceFile').files[0]||null;let r=await api('/complaints','POST',obj);let uploadInfo='';if(chosen){try{const form=new FormData();form.append('file',chosen);let up=await fetch('/api/complaints/'+r.id+'/evidence',{method:'POST',headers:{Authorization:'Bearer '+saved.token},body:form});if(!up.ok){let body=await up.json().catch(()=>({}));throw Error(body.detail||'Evidence upload failed')}uploadInfo=' Supporting image saved.'}catch(upError){uploadInfo=' Report saved, but image upload requires retry: '+upError.message}}document.getElementById('submitResult').innerHTML=`<div class="successbar">✓ Report saved. Reference <b>${esc(r.reference)}</b>.${esc(uploadInfo)} <button class="textbtn" onclick="openCase(${r.id})">Track now →</button></div>`;f.reset()}catch(e){document.getElementById('submitResult').innerHTML=`<div class="errorbar">${esc(e.message)}</div>`}}}
function getGPS(){if(!navigator.geolocation)return alertMsg('Location is unavailable; enter address manually.',true);navigator.geolocation.getCurrentPosition(p=>{lat.value=p.coords.latitude.toFixed(5);lon.value=p.coords.longitude.toFixed(5)},()=>alertMsg('Location permission unavailable; enter address manually.',true),{timeout:10000})}
function aboutPage(){return `<div class="eyebrow">APPLICATION INFORMATION</div><h1>About PowerResolve</h1><div class="panel"><h2>Transparent electricity complaints management</h2><p>PowerResolve is a mobile-friendly research prototype demonstrating a complete complaint workflow. It provides multi-role intake, server-derived priority, location fields, auditable assignments, status history and feedback.</p><div class="tip">Research software only. All preloaded consumer identities and electricity complaints are synthetic. No utility provider is connected; digital resolution in this demonstration is not proof of physical repair.</div></div>`}
render();setInterval(()=>{if(saved&&['dashboard','complaints'].includes(current)&&!document.querySelector('input:focus,textarea:focus,select:focus'))render()},15000);
</script></body></html>
