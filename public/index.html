<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#132652"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="icon" type="image/png" href="/icons/powerresolve-192.png"/>
<link rel="apple-touch-icon" href="/icons/powerresolve-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="application-name" content="PowerResolve"/>
<title>PowerResolve • Service complaints</title>
<link rel="stylesheet" href="/styles.css"/>
</head><body><div id="root"></div><script>
const root=document.getElementById('root'), CATS=['Outage','Meter fault','Billing','Safety hazard','Voltage fluctuation','Transformer fault'];
let saved=JSON.parse(localStorage.getItem('pwrSession')||'null'), current='dashboard', selected=null, loading=false, message='', filter='all', cache=[];
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;});
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(error=>console.warn('Offline page not available:',error));
  });
}
async function installPowerResolve(){
  const standalone=window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  if(standalone || window.navigator.standalone){
    alertMsg('PowerResolve is already installed on your device.');
    return;
  }
  if(deferredInstallPrompt){
    const prompt=deferredInstallPrompt;
    deferredInstallPrompt=null;
    await prompt.prompt();
    await prompt.userChoice;
    return;
  }
  alertMsg('On Android Chrome: tap the three-dot browser menu, then choose Install app or Add to Home screen. On iPhone Safari: Share → Add to Home Screen.');
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function alertMsg(s,bad=false){message=(bad?'ERROR: ':'')+s;let t=document.getElementById('notice');if(t){t.innerHTML=`<div class="${bad?'errorbar':'successbar'}">${esc(message)}</div>`;setTimeout(()=>{if(t)t.innerHTML=''},6000)}else alert(s)}
async function api(path,method='GET',data){let opts={method,headers:{}};if(saved?.token)opts.headers.Authorization='Bearer '+saved.token;if(data!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(data)}let res=await fetch('/api'+path,opts);let obj=await res.json().catch(()=>({}));if(!res.ok)throw Error(obj.detail||'Request failed ('+res.status+')');return obj}
function logout(){if(saved?.token)fetch('/api/logout',{method:'POST',headers:{Authorization:'Bearer '+saved.token}}).catch(()=>{});saved=null;localStorage.removeItem('pwrSession');current='dashboard';render()}
async function authenticate(e,register){e.preventDefault();let alias=document.getElementById('alias').value,password=document.getElementById('password').value;try{if(register)await api('/register','POST',{alias,password});saved=await api('/login','POST',{alias,password});localStorage.setItem('pwrSession',JSON.stringify(saved));render()}catch(e){alertMsg(e.message,true)}}
function authPage(register=false){root.innerHTML=`<div class="auth"><div class="authbox"><div class="logoauth"><div class="brand-mark">⚡</div> PowerResolve</div><div class="eyebrow">ELECTRICITY SERVICE HELP DESK</div><h1>${register?'Create an account':'Welcome back'}</h1><p>${register?'Register as a consumer to report and track electricity service problems.':'Sign in to access your complaint workspace and updates.'}</p><div id="notice" role="status" aria-live="polite"></div><form id="authform"><div class="field"><label for="alias">Account alias</label><input id="alias" placeholder="e.g. Consumer01" required minlength="3"/></div><div class="field"><label for="password">Password</label><input id="password" placeholder="Enter password" type="password" required minlength="8"/></div><button class="action" style="width:100%;margin-top:8px" type="submit">${register?'Create account':'Sign in securely'}</button></form><button class="install-app" type="button" onclick="installPowerResolve()">⬇ Install PowerResolve app</button><p style="text-align:center;margin:20px 0 0"><a href="#" id="toggle">${register?'Already registered? Sign in':'New user? Create an account'}</a></p><div class="tip" style="margin-top:22px">Local research prototype. Demo identities are synthetic. Contact the electricity provider directly for actual hazards.</div><div class="foot">POWERRESOLVE • RESEARCH SOFTWARE DEMONSTRATION</div></div></div>`;document.getElementById('authform').onsubmit=e=>authenticate(e,register);document.getElementById('toggle').onclick=e=>{e.preventDefault();authPage(!register)}}
function navTo(x){current=x;selected=null;render()}
function navIcon(name){
  const paths={
    dashboard:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    complaints:'<path d="M8 4h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 4h6v3H9zM8 12h8M8 16h7"/>',
    new:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/>',
    about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'
  };
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">'+(paths[name]||'')+'</svg>';
}
function scaffold(){let user=saved.user, who=user.role, nav=[['dashboard','▦','Overview'],['complaints','▤','Complaints'],...(who==='consumer'?[['new','⊕','Report issue']]:[]),['about','ⓘ','About']];return `<div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">⚡</span><div>PowerResolve<small>SMART SERVICE DESK</small></div></div><div class="side-label">Workspace</div>${nav.map(n=>`<button class="nav ${current===n[0]?'active':''}" ${current===n[0]?'aria-current="page"':''} onclick="navTo('${n[0]}')"><i aria-hidden="true">${navIcon(n[0])}</i><span>${n[2]}</span></button>`).join('')}<div class="side-footer"><strong>${esc(user.alias)}</strong>${esc(who.toUpperCase())}<p style="margin-top:16px"><button class="nav" onclick="logout()">↩ <span>Sign out</span></button></p></div></aside><main class="main"><header class="top"><div><div class="eyebrow">POWERRESOLVE / ${who.toUpperCase()}</div><div class="crumb">Service intelligence / ${esc(current)}</div></div><div class="identity"><button class="install-app" type="button" onclick="installPowerResolve()">Install app</button><span>${esc(user.alias)}</span><div class="avatar">${esc(user.alias.slice(0,2).toUpperCase())}</div><button class="textbtn" onclick="logout()">Exit</button></div></header><div id="notice" role="status" aria-live="polite"></div><section id="view"></section><div class="foot" style="text-align:left">Functional local prototype · Simulated records · Not connected to a distribution company</div></main></div>`}
function statusPill(s){return `<span class="pill ${esc(s)}">${esc(s.replaceAll('_',' '))}</span>`}
function priPill(s){return `<span class="pill ${String(s).toLowerCase()}">${esc(s)}</span>`}
function fmtDate(s){return s?new Date(s).toLocaleString('en-NG',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}
async function render(){if(!saved){authPage();return}root.innerHTML=scaffold();let view=document.getElementById('view');view.innerHTML='<div class="panel">Loading workspace…</div>';try{if(current==='dashboard'){let [stats,list]=await Promise.all([api('/stats'),api('/complaints')]);cache=list;view.innerHTML=dashboard(stats,list)}else if(current==='complaints'){cache=await api('/complaints');view.innerHTML=selected?await detail(selected):complaintsPage(cache)}else if(current==='new'){view.innerHTML=newPage();initNew()}else view.innerHTML=aboutPage()}catch(e){view.innerHTML=`<div class="errorbar">${esc(e.message)}</div>`}}
function dashboard(stats,list){let user=saved.user,done=stats.resolved,rate=stats.total?Math.round(done/stats.total*100):0;return `<div class="eyebrow">LIVE WORKSPACE / DEMONSTRATION</div><div class="hero"><div class="eyebrow" style="color:#86e3db">YOUR DIGITAL UTILITY DESK</div><h1>${user.role==='consumer'?'Electricity support, simplified.':'Manage cases with clarity.'}</h1><p>${user.role==='consumer'?'Report an outage, meter problem, billing concern or electrical hazard — and follow every status update.':'Monitor incoming electricity service complaints, prioritize hazards and maintain an accountable resolution history.'}</p><button class="action" onclick="navTo('${user.role==='consumer'?'new':'complaints'}')">${user.role==='consumer'?'+ Report a complaint':'Open complaint queue'}</button></div><div class="stats"><div class="stat"><label>Total complaints</label><strong>${stats.total}</strong><em>Registered cases</em></div><div class="stat"><label>Closed / resolved</label><strong>${done}</strong><em>Recorded state</em></div><div class="stat"><label>Emergency reports</label><strong>${stats.emergency}</strong><em>Priority triage</em></div><div class="stat"><label>Case completion</label><strong>${rate}%</strong><em>Demo workflow</em></div></div><div class="two-col"><div class="panel"><div class="panel-head"><h2>Recent complaints</h2><button class="textbtn" onclick="navTo('complaints')">View all →</button></div>${list.slice(0,6).map(c=>`<div class="list-card"><div><div class="case-title">${esc(c.category)}</div><div class="case-id">${esc(c.reference)}</div><div class="case-meta">${esc(c.address)} · ${fmtDate(c.created_at)}</div></div><div style="text-align:right">${statusPill(c.status)}<br/><button class="textbtn" onclick="openCase(${c.id})">Details</button></div></div>`).join('')||'<p class="sub">No complaints yet. Create a report to begin.</p>'}</div><div><div class="panel"><h2>Workflow visibility</h2><p class="sub">Records are tracked from intake through administrative review, assignment, field work and resolution.</p><div class="kpi-bar"><div class="kpi-fill" style="width:${rate}%"></div></div><strong>${done} of ${stats.total}</strong> cases resolved or closed <div class="tip" style="margin-top:22px">⚡ Safety hazards receive Emergency priority in the system. This software is not an emergency response channel.</div></div><div class="panel"><h3>Common categories</h3>${['Outage','Meter fault','Billing','Safety hazard'].map(s=>`<p class="sub" style="margin:9px 0">${s}: <strong>${list.filter(a=>a.category===s).length}</strong></p>`).join('')}</div></div></div>`}
function complaintsPage(list){let options=['all','received','reviewed','assigned','in_progress','resolved','reopened','closed'];let filtered=filter==='all'?list:list.filter(c=>c.status===filter);return `<div class="headerline"><div><div class="eyebrow">COMPLAINT WORKFLOW</div><h1>${saved.user.role==='consumer'?'My complaints':'Complaint management'}</h1><p class="sub">Every case has an identifiable reference, priority and traceable status history.</p></div>${saved.user.role==='consumer'?'<button class="action" onclick="navTo(\'new\')">+ New report</button>':''}</div><div class="panel"><div class="panel-head"><h2>Registered cases <span class="sub">(${filtered.length})</span></h2><select class="filter" id="filter" aria-label="Filter complaints by status" onchange="changeFilter(this.value)">${options.map(s=>`<option value="${s}" ${filter===s?'selected':''}>${s==='all'?'All statuses':s.replace('_',' ')}</option>`).join('')}</select></div><div class="tablewrap"><table class="cases-table"><thead><tr><th>REFERENCE</th><th>ISSUE / LOCATION</th><th>PRIORITY</th><th>STATUS</th><th>${saved.user.role==='consumer'?'SUBMITTED':'CONSUMER / ASSIGNED'}</th><th>ACTION</th></tr></thead><tbody>${filtered.map(c=>`<tr><td data-label="Reference"><b>${esc(c.reference)}</b></td><td data-label="Issue / location"><div><b>${esc(c.category)}</b><div class="smallnote">${esc(c.address.slice(0,34))}</div></div></td><td data-label="Priority">${priPill(c.priority)}</td><td data-label="Status">${statusPill(c.status)}</td><td data-label="Submitted / assigned">${saved.user.role==='consumer'?fmtDate(c.created_at):esc(c.consumer)+' / '+esc(c.agent||'Unassigned')}</td><td data-label="Actions"><button class="textbtn" onclick="openCase(${c.id})">View →</button></td></tr>`).join('')}</tbody></table>${!filtered.length?'<p class="sub">There are no cases in the selected view.</p>':''}</div></div>`}
function changeFilter(s){filter=s;document.getElementById('view').innerHTML=complaintsPage(cache)}
function openCase(id){selected=id;current='complaints';render()}
async function detail(id){let c=await api('/complaints/'+id),u=saved.user,events=c.events;let agents=[];if(u.role==='admin')agents=await api('/agents');return `<div class="headerline"><div><button class="textbtn" onclick="navTo('complaints')">← All cases</button><div class="eyebrow">CASE DETAIL / ${esc(c.reference)}</div><h1>${esc(c.category)}</h1><p class="sub">Recorded ${fmtDate(c.created_at)} · ${esc(c.address)}</p></div><div>${priPill(c.priority)} ${statusPill(c.status)}</div></div><div class="two-col"><div><div class="panel"><h2>Complaint information</h2><p>${esc(c.details)}</p><div class="grid2"><div><h3>Service address</h3><p class="sub">${esc(c.address)}</p></div><div><h3>GPS coordinates</h3><p class="sub">${c.lat===null?'Not supplied':Number(c.lat).toFixed(5)+', '+Number(c.lon).toFixed(5)}</p></div><div><h3>Priority</h3><p>${priPill(c.priority)}</p></div><div><h3>Assigned agent</h3><p class="sub">${c.assigned_to||'Unassigned'}</p></div></div><div class="tip">Complaint reference: <b>${esc(c.reference)}</b>. Notifications appear in this recorded event timeline.</div></div><div class="panel"><h2>Case activity</h2><div class="timeline">${events.slice().reverse().map(e=>`<div class="event"><strong>${esc(e.to_status.replace('_',' '))}</strong><time>${fmtDate(e.occurred_at)} · ${esc(e.actor)}</time><p>${esc(e.note||'Status update recorded')}</p></div>`).join('')}</div></div></div><div><div class="panel"><h2>Available actions</h2>${actions(c,agents)}<hr style="border:0;border-top:1px solid #e7edf6;margin:20px 0"><h3>Customer feedback</h3><p class="sub">Feedback responses: ${c.feedback.length}</p>${c.feedback.map(f=>`<p class="smallnote">Rating ${f.rating}/5 — ${esc(f.comment)}</p>`).join('')}</div><div class="panel"><h3>Operational timestamps</h3>${[['Received',c.created_at],['Assigned',c.assigned_at],['Started',c.started_at],['Resolved',c.resolved_at]].map(x=>`<p class="sub">${x[0]}: <b>${fmtDate(x[1])}</b></p>`).join('')}</div></div></div>`}
function actions(c,agents){let status=c.status,role=saved.user.role,act='';if(role==='admin'){if(status==='received')act=`<button class="action" onclick="doAction(${c.id},'review')">Mark reviewed</button>`;if(status==='reviewed')act=`<div class="field"><label>Assign technician</label><select id="agentPick">${agents.map(a=>`<option value="${a.id}">${esc(a.alias)}</option>`).join('')}</select></div><button class="action" onclick="doAction(${c.id},'assign')">Assign case</button><div class="tip" style="margin-top:16px">Need another technician? Create an account below. Do not reuse your administrator password.</div><div class="field"><label>New technician alias</label><input id="newAgentAlias" placeholder="e.g. TechnicianEnugu01" autocomplete="off" maxlength="32"/></div><div class="field"><label>Temporary technician password</label><input id="newAgentPassword" type="password" minlength="8" autocomplete="new-password"/></div><button class="action secondary" type="button" onclick="createAgent(${c.id})">Create technician</button>`;if(status==='resolved')act=`<button class="action" onclick="doAction(${c.id},'close')">Close confirmed case</button>`}else if(role==='agent'){if(status==='assigned'||status==='reopened')act=`<button class="action" onclick="doAction(${c.id},'${status==='assigned'?'start':'resume'}')">Start work</button>`;if(status==='in_progress')act=`<div class="field"><label>Work performed</label><textarea id="actionNote" placeholder="Document action and outcome"></textarea></div><button class="action" onclick="doAction(${c.id},'resolve')">Record resolution</button>`}else if(role==='consumer'&&status==='resolved'){act=`<div class="field"><label>Was this case handled satisfactorily?</label><select id="rating"><option value="5">5 – Excellent</option><option value="4">4 – Good</option><option value="3">3 – Fair</option><option value="2">2 – Poor</option><option value="1">1 – Very poor</option></select></div><div class="field"><label>Feedback</label><textarea id="feedback" placeholder="Share your experience"></textarea></div><button class="action" onclick="sendFeedback(${c.id})">Save feedback</button><hr style="border:0;border-top:1px solid #eee;margin:18px 0"><div class="field"><label>Still unresolved? Explain why</label><textarea id="actionNote" placeholder="Issue persists despite reported action"></textarea></div><button class="action danger" onclick="doAction(${c.id},'reopen')">Reopen case</button>`}return act||'<p class="sub">No actions available for this role and case state.</p>'}
async function createAgent(id){const alias=document.getElementById('newAgentAlias')?.value.trim(),password=document.getElementById('newAgentPassword')?.value;try{if(!alias||!password)throw Error('Provide a technician alias and password');await api('/agents','POST',{alias,password});selected=id;await render();alertMsg('Technician created. Select the technician and assign the case.')}catch(e){alertMsg(e.message,true)}}
async function doAction(id,action){let agent_id=document.getElementById('agentPick')?Number(document.getElementById('agentPick').value):undefined,note=document.getElementById('actionNote')?.value||'';try{await api('/complaints/'+id+'/action','POST',{action,agent_id,note});render()}catch(e){alertMsg(e.message,true)}}
async function sendFeedback(id){try{await api('/complaints/'+id+'/feedback','POST',{rating:Number(document.getElementById('rating').value),comment:document.getElementById('feedback').value});render()}catch(e){alertMsg(e.message,true)}}
function newPage(){return `<div class="eyebrow">CONSUMER SELF SERVICE</div><h1>Report electricity problem</h1><p class="sub">A few details help the right team identify and process your report.</p><div class="two-col"><div class="panel"><h2>New complaint</h2><form id="complaintForm"><div class="field"><label for="category">Type of problem *</label><select required id="category">${CATS.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label for="details">Describe what happened *</label><textarea id="details" required minlength="10" placeholder="For example: Electricity went off for this street at about 2 pm"></textarea></div><div class="field"><label for="address">Address or landmark *</label><input required id="address" minlength="6" placeholder="Street, district and nearby landmark"/></div><div class="grid2"><div class="field"><label for="lat">Latitude (optional)</label><input id="lat" type="number" step="any" min="-90" max="90" placeholder="6.4491"/></div><div class="field"><label for="lon">Longitude (optional)</label><input id="lon" type="number" step="any" min="-180" max="180" placeholder="7.5028"/></div></div><button class="action secondary" type="button" onclick="getGPS()">⌖ Use device location</button><div class="grid2"><div class="field"><label for="affected">Estimated consumers affected</label><input id="affected" type="number" min="1" max="100000" value="1"/></div><div class="field"><label style="margin-top:23px"><input type="checkbox" id="hazard" style="width:auto"> Immediate electrical hazard</label></div></div><button class="action" style="width:100%;margin-top:16px" type="submit">Submit complaint securely →</button></form><div id="submitResult" role="status" aria-live="polite"></div></div><div><div class="panel"><h2>What happens next?</h2><div class="timeline"><div class="event"><strong>Submit your report</strong><p>Receive a unique complaint reference.</p></div><div class="event"><strong>Administrative review</strong><p>Urgency and service area are reviewed.</p></div><div class="event"><strong>Assignment and action</strong><p>Authorized agents record each step.</p></div><div class="event"><strong>Follow the outcome</strong><p>View status and submit feedback.</p></div></div></div><div class="tip">For exposed conductors, fires or immediate danger: keep a safe distance and contact official emergency services. Reporting here does not dispatch an actual team.</div></div></div>`}
function initNew(){
  const f=document.getElementById('complaintForm');
  f.onsubmit=async e=>{
    e.preventDefault();
    const obj={
      request_id:(crypto.randomUUID?.()||'pwr-'+Date.now()+'-'+Math.random()),
      category:category.value,
      details:details.value,
      address:address.value,
      lat:lat.value?Number(lat.value):null,
      lon:lon.value?Number(lon.value):null,
      hazard:hazard.checked,
      affected:Number(affected.value)
    };
    try{
      const r=await api('/complaints','POST',obj);
      document.getElementById('submitResult').innerHTML=`<div class="successbar">✓ Report saved. Reference <b>${esc(r.reference)}</b>. <button class="textbtn" onclick="openCase(${r.id})">Track now →</button></div>`;
      f.reset();
    }catch(error){
      document.getElementById('submitResult').innerHTML=`<div class="errorbar">${esc(error.message)}</div>`;
    }
  };
}
function getGPS(){if(!navigator.geolocation)return alertMsg('Location is unavailable; enter address manually.',true);navigator.geolocation.getCurrentPosition(p=>{lat.value=p.coords.latitude.toFixed(5);lon.value=p.coords.longitude.toFixed(5)},()=>alertMsg('Location permission unavailable; enter address manually.',true),{timeout:10000})}
function aboutPage(){return `<div class="eyebrow">APPLICATION INFORMATION</div><h1>About PowerResolve</h1><div class="panel"><h2>Transparent electricity complaints management</h2><p>PowerResolve is a mobile-friendly research prototype demonstrating a complete complaint workflow. It provides multi-role intake, server-derived priority, location fields, auditable assignments, status history and feedback.</p><div class="tip">Research software only. All preloaded consumer identities and electricity complaints are synthetic. No utility provider is connected; digital resolution in this demonstration is not proof of physical repair.</div></div>`}
render();setInterval(()=>{if(saved&&['dashboard','complaints'].includes(current)&&!document.querySelector('input:focus,textarea:focus,select:focus'))render()},15000);
</script></body></html>
